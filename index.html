<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ausmongol — Австралиас ирсэн хуучин бараа</title>
<style>
  :root{
    --blue:#3665f3; --blue-d:#2b4fc0; --ink:#191919; --gray:#707070;
    --line:#e5e5e5; --line-d:#c7c7c7; --bg:#ffffff; --soft:#f7f7f7;
    --red:#e0103a; --green:#1bab49;
    --c-red:#e53238; --c-blue:#0064d2; --c-yellow:#f5af02; --c-green:#86b817;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Helvetica,Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;font-size:14px}
  a{color:inherit;text-decoration:none}
  a.lnk{color:var(--blue)} a.lnk:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{display:block}
  input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line-d);border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
  label{font-size:13px;font-weight:700;display:block;margin:12px 0 4px}
  .wrap{max-width:none;margin:auto;padding:0 48px}
  @media(max-width:900px){.wrap{padding:0 20px}}
  @media(max-width:640px){.wrap{padding:0 14px}}

  /* ── buttons ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 22px;border-radius:999px;font-weight:700;font-size:14px;transition:background .1s}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-d)}
  .btn-primary:disabled{background:#c5c5c5;cursor:not-allowed}
  .btn-outline{border:1px solid var(--blue);color:var(--blue);background:#fff}
  .btn-outline:hover{background:#eef3ff}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{background:#333}

  /* ── utility bar ── */
  .util{border-bottom:1px solid var(--line);font-size:12px}
  .util .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
  .util a,.util span{color:var(--ink)}
  .util .l,.util .r{display:flex;gap:16px;align-items:center;white-space:nowrap;overflow:hidden}
  .util a:hover{text-decoration:underline}
  @media(max-width:760px){.util .hide-m{display:none}}

  /* ── header ── */
  .hdr{border-bottom:1px solid var(--line)}
  .hdr .wrap{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px}
  @media(max-width:640px){.hdr .wrap{gap:10px}}
  .logo{font-size:34px;font-weight:800;letter-spacing:-2.5px;line-height:1;flex:none;font-family:Arial,Helvetica,sans-serif}
  @media(max-width:760px){.logo{font-size:26px;letter-spacing:-1.5px}}
  .hnav{display:flex;gap:4px;align-items:center;margin-left:auto}
  .hnav a{padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:#333;white-space:nowrap}
  .hnav a:hover{background:var(--soft)}
  @media(max-width:760px){.hnav a{display:none}}
  .msearch{display:flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:999px;height:40px;width:300px;padding:0 6px 0 16px;transition:all .15s}
  .msearch:focus-within{background:#fff;border-color:var(--ink);width:360px}
  @media(max-width:760px){.msearch{width:100%;flex:1}.msearch:focus-within{width:100%}}
  .msearch input{border:none;background:none;height:100%;padding:0;font-size:13.5px}
  .msearch input:focus{outline:none}
  .msearch button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--gray);flex:none}
  .msearch button:hover{background:#e8e8e8;color:var(--ink)}
  .hico{position:relative;font-size:20px;padding:4px}
  .hico .pill{position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}


  /* ── hero (Australia) ── */
  .banner{background:var(--soft);border-radius:14px;margin-top:16px;padding:0;display:grid;grid-template-columns:1fr 1.1fr;overflow:hidden;align-items:center}
  .btxt{padding:36px 40px}
  .banner h1{font-size:26px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px;line-height:1.2}
  .banner p{font-size:13.5px;color:#555;margin-bottom:18px;max-width:460px}
  .bau{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#555;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px;margin-bottom:14px}
  .bslide{position:relative;height:330px;margin:8px;border-radius:10px;overflow:hidden;background:#e8e8e8}
  .bslide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
  .bslide img.on{opacity:1}
  .bcap{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:2}
  .bdots{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:2}
  .bdots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.3);padding:0}
  .bdots button.on{background:#fff;transform:scale(1.25)}
  .bcred{position:absolute;right:12px;top:10px;font-size:9px;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}
  @media(max-width:900px){.banner{grid-template-columns:1fr}.bslide{height:200px}.btxt{padding:26px 24px}}

  /* ── sidebar + shop layout (eBay style) ── */
  .shop{display:flex;gap:30px;align-items:flex-start;margin-top:8px}
  .side{width:215px;flex:none;position:sticky;top:76px;padding-top:18px}
  @media(max-width:900px){.side{display:none}}
  .shop-main{flex:1;min-width:0}
  .fh{font-size:15px;font-weight:800;margin:20px 0 8px}
  .fh:first-child{margin-top:0}
  .flink{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;margin:1px 0;font-size:13.5px;color:#333;width:100%;text-align:left;border-radius:8px;transition:background .1s}
  .flink:hover{background:var(--soft)}
  .flink.on{background:#f0f2f5}
  .flink.on span{font-weight:800;color:var(--ink)}
  .fcount{font-size:11px;font-weight:700;color:var(--gray);background:var(--soft);border-radius:999px;padding:1px 9px;min-width:26px;text-align:center}
  .flink.on .fcount{background:var(--ink);color:#fff}
  .fchips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0}
  .fchip{border:1px solid var(--line-d);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:#444;background:#fff;transition:all .1s}
  .fchip:hover{border-color:var(--ink)}
  .fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .fsep{height:1px;background:var(--line);margin:16px 0}
  .mchips{display:none}
  @media(max-width:900px){
    .mchips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .mchips::-webkit-scrollbar{display:none}
    .mchips .fchip{flex:none;padding:8px 16px;font-size:13px}
  }

  /* ── gallery ── */
  .gal{display:flex;flex-direction:column}
  .gmain{aspect-ratio:1/1;background:var(--soft);position:relative}
  .gmain img{width:100%;height:100%;object-fit:cover}
  .gthumbs{display:flex;gap:8px;padding:10px}
  .gth{width:58px;height:58px;border-radius:8px;overflow:hidden;border:2px solid transparent;background:var(--soft);flex:none;padding:0}
  .gth img{width:100%;height:100%;object-fit:cover}
  .gth.on{border-color:var(--ink)}
  .imgn{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.9);border-radius:999px;font-size:11px;font-weight:700;padding:3px 9px;box-shadow:0 1px 3px rgba(0,0,0,.2)}

  /* ── sections & cards ── */
  .sechead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 14px}
  .sechead h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
  .sechead a{font-size:13px;color:var(--ink);text-decoration:underline}
  .sechead a:hover{color:var(--blue)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px 14px;padding-bottom:44px}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  .pcard{padding:6px;border-radius:10px;display:flex;flex-direction:column}
  .pcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .pimg{position:relative;aspect-ratio:1/1;background:var(--soft);border-radius:10px;overflow:hidden;cursor:pointer;margin-bottom:8px}
  .pimg img{width:100%;height:100%;object-fit:cover}
  .heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:grid;place-items:center;font-size:16px}
  .soldov{position:absolute;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center}
  .soldov b{background:var(--ink);color:#fff;padding:5px 14px;border-radius:4px;font-size:12px;letter-spacing:.6px}
  .pname{font-size:14px;font-weight:400;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;line-height:1.35}
  .pname:hover{text-decoration:underline}
  .pcondrow{display:flex;align-items:center;gap:8px;margin:5px 0 2px;font-size:12px;color:var(--gray)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
  .d-ex{background:#1bab49}.d-vg{background:#3665f3}.d-gd{background:#e0a800}
  .prow{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
  .pprice{font-size:18px;font-weight:800;letter-spacing:-.3px}
  .addc{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-d);background:#fff;color:var(--ink);font-size:19px;line-height:1;display:grid;place-items:center;transition:all .12s;flex:none}
  .addc:hover:not(:disabled):not(.in){background:var(--ink);border-color:var(--ink);color:#fff}
  .addc:active:not(:disabled){transform:scale(.92)}
  .addc.in{background:var(--ink);border-color:var(--ink);color:#fff;font-size:14px;cursor:default}
  .addc:disabled{opacity:.35;cursor:not-allowed}
  .empty{padding:70px 20px;text-align:center;color:var(--gray)}
  .empty .big{font-size:40px;margin-bottom:10px}


  /* ── drawer / modal ── */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none}
  .scrim.open{display:block}
  .drawer{position:fixed;top:0;right:-440px;width:min(410px,94vw);height:100%;background:#fff;z-index:70;box-shadow:-8px 0 30px rgba(0,0,0,.2);transition:right .22s ease;display:flex;flex-direction:column}
  .drawer.open{right:0}
  .dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .dhead b{font-size:16px}
  .dbody{flex:1;overflow-y:auto;padding:12px 20px}
  .dfoot{padding:14px 20px;border-top:1px solid var(--line)}
  .x{font-size:20px;color:var(--gray);padding:2px 8px;border-radius:6px}
  .x:hover{background:var(--soft)}
  .citem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .citem .th{width:64px;height:64px;border-radius:8px;background:var(--soft);overflow:hidden;flex:none}
  .citem .th img{width:100%;height:100%;object-fit:cover}
  .citem .nm{font-size:13px}
  .citem .pr{font-size:14px;font-weight:700;margin-top:2px}
  .rm{color:var(--blue);font-size:12px;margin-top:4px;text-decoration:underline}
  .totrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
  .totrow.big{font-weight:800;font-size:16px;padding-top:8px}

  .modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:16px}
  .modal.open{display:grid}
  .mcard{background:#fff;border-radius:14px;max-width:780px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
  .mgrid{display:grid;grid-template-columns:1.05fr 1fr}
  @media(max-width:680px){.mgrid{grid-template-columns:1fr}}
  .mimg{aspect-ratio:1/1;background:var(--soft)}
  .mimg img{width:100%;height:100%;object-fit:cover}
  .minfo{padding:26px}
  .minfo h2{font-size:20px;font-weight:500;line-height:1.3;margin-bottom:10px}
  .mprice{font-size:26px;font-weight:800}
  .mrow{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
  .mrow span:first-child{color:var(--gray);width:110px;flex:none}
  .mclose{position:absolute;top:10px;right:10px;background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:16px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.15)}

  /* ── pages ── */
  .page{max-width:660px;margin:30px auto 60px;padding:0 20px}
  .page h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
  .page .sub{color:var(--gray);font-size:13px;margin-bottom:18px}
  .card{border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;background:#fff}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}
  .note{background:var(--soft);border-radius:8px;padding:11px 14px;font-size:12px;color:#555;margin-top:14px}

  /* timeline */
  .tl{margin:18px 0}
  .tstep{display:flex;gap:14px;position:relative;padding-bottom:20px}
  .tstep:last-child{padding-bottom:0}
  .tdot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-d);background:#fff;display:grid;place-items:center;font-size:11px;flex:none;z-index:1;color:var(--gray)}
  .tstep.done .tdot{background:var(--green);border-color:var(--green);color:#fff}
  .tstep:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
  .tstep.done:not(:last-child)::before{background:var(--green)}
  .tstep b{font-size:13px;display:block}
  .tstep span{font-size:11px;color:var(--gray)}

  .badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700}
  .b-new{background:#e8f0fe;color:#1a4fd6}.b-confirmed{background:#e6f6ec;color:#12813a}
  .b-preparing{background:#fdf3d7;color:#8a6a10}.b-delivering{background:#efe8fb;color:#5f39a5}
  .b-delivered{background:var(--green);color:#fff}.b-cancelled{background:#fde8ec;color:var(--red)}

  /* ── admin ── */
  .admin{max-width:none;margin:26px auto 60px;padding:0 48px}
  @media(max-width:900px){.admin{padding:0 20px}}
  .atabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
  .atab{padding:11px 18px;font-weight:700;font-size:14px;color:var(--gray);border-bottom:3px solid transparent;margin-bottom:-1px}
  .atab.on{color:var(--ink);border-color:var(--blue)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{font-size:22px;display:block;letter-spacing:-.5px}
  .stat span{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tth{width:46px;height:46px;border-radius:6px;background:var(--soft);overflow:hidden}
  .tth img{width:100%;height:100%;object-fit:cover}
  .ibtn{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line-d);background:#fff;margin:2px}
  .ibtn:hover{border-color:var(--ink)}
  .ibtn.danger{color:var(--red)}
  .upzone{border:1px dashed var(--line-d);border-radius:10px;padding:20px;text-align:center;color:var(--gray);font-size:13px;cursor:pointer;background:var(--soft)}
  .upzone:hover{border-color:var(--blue);color:var(--blue)}
  .prev{width:110px;height:110px;border-radius:10px;object-fit:cover;border:1px solid var(--line);margin-top:10px}
  .tblwrap{overflow-x:auto}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:8px;font-size:13px;z-index:100;opacity:0;transition:all .22s ease;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{border-top:1px solid var(--line);margin-top:20px;padding:26px 0 34px;font-size:12px;color:var(--gray)}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  footer a{text-decoration:underline}
  footer a:hover{color:var(--blue)}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid #ccc;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="logo" href="#/" id="logoEl"></a>
    <div class="hnav">
      <a href="#/track">Захиалга хянах</a>
      <a href="#/about">Хэрхэн ажилладаг вэ?</a>
    </div>
    <div class="msearch">
      <input id="q" placeholder="Хайх…" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" title="Хайх">⌕</button>
    </div>
    <button class="hico" title="Сагс" onclick="ui.openCart()">🛒<span class="pill" id="cartCount">0</span></button>
  </div>
</header>

<main id="app"><div class="empty"><span class="spin"></span><p style="margin-top:10px">Ачаалж байна…</p></div></main>

<footer>
  <div class="wrap">
    <div><b style="color:var(--ink)">Ausmongol</b> © 2026 · Австралиас сонгож ирүүлсэн хуучин бараа · УБ хот · 09:00–20:00</div>
    <div><a href="#/about">Хэрхэн ажилладаг вэ?</a> &nbsp;·&nbsp; <a href="#/track">Захиалга хянах</a> &nbsp;·&nbsp; <a href="#/admin">Админ</a></div>
  </div>
</footer>

<div class="scrim" id="scrim" onclick="ui.closeAll()"></div>
<div class="drawer" id="cartDrawer">
  <div class="dhead"><b>Таны сагс</b><button class="x" onclick="ui.closeAll()">✕</button></div>
  <div class="dbody" id="cartBody"></div>
  <div class="dfoot" id="cartFoot"></div>
</div>

<div class="modal" id="pModal"><div class="mcard" id="pModalCard"></div></div>
<div id="toast"></div>

<script>
/* ═══════════ STATE & STORAGE ═══════════ */
const CATS = ["Электроник","Багаж","Гэр ахуй","Загвар, гоо сайхан","Машин"];
const CATICONS = {"Электроник":"📱","Багаж":"🔧","Гэр ахуй":"🍳","Загвар, гоо сайхан":"🕶","Машин":"🚗"};
const CAT_REMAP = {"Гар утас":"Электроник","Цахилгаан бараа":"Электроник","Гэр ахуйн бараа":"Гэр ахуй","Гоо сайхан":"Загвар, гоо сайхан","Хувцас":"Загвар, гоо сайхан","Гутал":"Загвар, гоо сайхан","Цүнх":"Загвар, гоо сайхан","Хүүхдийн бараа":"Гэр ахуй","Спорт & Аялал":"Загвар, гоо сайхан"};
const CONDS = {EXCELLENT:"Excellent — Шинэвтэр", VERY_GOOD:"Very good — Маш сайн", GOOD:"Good — Сайн"};
const STATUSES = [
  {k:"new",        t:"Хүлээн авсан",      b:"b-new"},
  {k:"confirmed",  t:"Баталгаажсан",      b:"b-confirmed"},
  {k:"preparing",  t:"Бэлтгэж байна",     b:"b-preparing"},
  {k:"delivering", t:"Хүргэлтэнд гарсан", b:"b-delivering"},
  {k:"delivered",  t:"Хүргэгдсэн",        b:"b-delivered"},
];
const stByKey = k => STATUSES.find(s=>s.k===k) || {k, t:k==="cancelled"?"Цуцлагдсан":k, b:"b-cancelled"};

const S = {

/* storage backend: claude.ai artifact дотор window.storage, локал файлд localStorage fallback */
const mem = {};
const hasWS = typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function";
const backend = hasWS ? window.storage : {
  async get(k){ let v=null; try{ v = localStorage.getItem("aus:"+k); }catch(e){ v = mem[k]??null; } return v==null?null:{key:k,value:v}; },
  async set(k,v){ try{ localStorage.setItem("aus:"+k, v); }catch(e){ mem[k]=v; } return {key:k,value:v}; },
  async delete(k){ try{ localStorage.removeItem("aus:"+k); }catch(e){ delete mem[k]; } return {key:k,deleted:true}; },
};
const store = {
  async get(k,sh=true){ try{ const r=await backend.get(k,sh); return r&&r.value!=null?JSON.parse(r.value):null; }catch(e){ return null; } },
  async set(k,v,sh=true){ try{ await backend.set(k,JSON.stringify(v),sh); return true; }catch(e){ console.error(e); return false; } },
  async del(k,sh=true){ try{ await backend.delete(k,sh); }catch(e){} }
};

async function loadAll(){

      seed();

/* placeholder + lazy image loading */
function placeholder(p){
  const ic = CATICONS[p.cat]||"📦";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#f2f2f2"/><text x="200" y="225" font-size="90" text-anchor="middle">${ic}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function imgList(p){
  const arr = [];
  const n = p.imgCount||0;
  for(let i=0;i<n;i++) arr.push({key:p.id+":"+i, sk:"img:"+p.id+":"+i});
  if(!n && p.hasImg) arr.push({key:p.id+":0", sk:"img:"+p.id});
  (p.imgs || (p.img?[p.img]:[])).forEach((u,i)=>arr.push({key:p.id+":u"+i, url:u}));
  if(!arr.length) arr.push({key:p.id+":ph", url:placeholder(p)});
  return arr;
}
const srcOf = (it,p) => it.url || S.imgCache[it.key] || placeholder(p);
function imgTag(it,p,extra=""){
  return `<img data-img="${it.key}" data-sk="${it.sk||""}" data-cat="${esc(p.cat)}" onerror="imgFail(this)" src="${srcOf(it,p)}" alt="${esc(p.name)}" ${extra}>`;
}
const imgQueue = [];
let imgBusy = false;
function reqKey(key, sk){
  if(!sk || S.imgCache[key]) return;
  if(!imgQueue.find(q=>q.key===key)) imgQueue.push({key, sk});
  pumpImgs();
}
async function pumpImgs(){
  if(imgBusy) return; imgBusy = true;
  while(imgQueue.length){
    const {key, sk} = imgQueue.shift();
    if(S.imgCache[key]) continue;
    try{
      const r = await backend.get(sk, true);
      if(r && r.value){ S.imgCache[key]=r.value;
        document.querySelectorAll(`img[data-img="${key}"]`).forEach(el=>el.src=r.value);
      }
    }catch(e){}
  }
  imgBusy = false;
}
function scanImgs(){ document.querySelectorAll("img[data-img]").forEach(el=>reqKey(el.dataset.img, el.dataset.sk)); }
window.imgFail = el => { el.onerror = null; el.src = placeholder({cat: el.dataset.cat || ""}); };

async function placeOrder(btn){
  const g = id => document.getElementById(id).value.trim();
  const name=g("cName"), phone=g("cPhone"), addr=g("cAddr");
  if(!name||!phone||!addr){ toast("Нэр, утас, хаягаа бүрэн бөглөнө үү"); return; }
  if(!/^\d{8}$/.test(phone.replace(/[^0-9]/g,""))){ toast("Утасны дугаараа 8 оронтой оруулна уу"); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Илгээж байна…';

  const fresh = await store.get("shop-data");
  if(fresh){ S.products = fresh.products||S.products; S.settings = Object.assign(S.settings,fresh.settings||{}); }
  const items = cartItems();
  if(!items.length){ toast("Сагсан дахь бараа зарагдсан байна"); btn.disabled=false; render(); return; }

  const freshOrders = await store.get("orders"); if(freshOrders) S.orders = freshOrders;
  const num = "AUS-" + (1000 + S.orders.length) + "-" + Math.random().toString(36).slice(2,4).toUpperCase();
  const order = {
    id: num, createdAt: Date.now(),
    items: items.map(p=>({pid:p.id,name:p.name,price:p.price,size:p.size||""})),
    total: cartTotal(),
    customer: {name, phone:phone.replace(/[^0-9]/g,""), city:g("cCity"), dist:g("cDist"), addr, note:g("cNote")},
    status: "new",
    history: [{status:"new", ts:Date.now()}]
  };
  items.forEach(p=>{ const t=S.products.find(x=>x.id===p.id); if(t) t.sold=true; });
  S.orders.push(order);
  const ok1 = await saveOrders(); const ok2 = await saveShop();
  if(!ok1||!ok2){ toast("Хадгалахад алдаа гарлаа, дахин оролдоно уу"); btn.disabled=false; return; }
  S.cart = [];
  document.getElementById("cartBody").innerHTML = `
    <div style="text-align:center;padding:30px 8px">
      <div style="font-size:44px">✅</div>
      <h3 style="margin:10px 0 4px">Захиалга амжилттай!</h3>
      <p style="font-size:12px;color:var(--gray)">Захиалгын дугаар:</p>
      <div style="font-size:22px;font-weight:800;letter-spacing:1px;margin:8px 0">${num}</div>
      <p style="font-size:12px;color:var(--gray)">Энэ дугаараа хадгалаад <b>«Захиалга хянах»</b> хэсгээс явцаа хараарай. Бид тантай удахгүй холбогдоно.</p>
      <button class="btn btn-primary" style="margin-top:16px" onclick="ui.closeAll();location.hash='#/track?${num}'">Захиалга хянах</button>
    </div>`;
  document.getElementById("cartFoot").innerHTML = "";
  updateCartCount();
}

function vTrack(){

  return `

      <button class="btn btn-primary" onclick="doTrack()">Хайх</button>
    </div>
    <div id="tRes"></div>

async function doTrack(){
  const q = document.getElementById("tq").value.trim().toUpperCase();
  const box = document.getElementById("tRes");
  if(!q){ box.innerHTML=""; return; }
  box.innerHTML = '<div style="padding:20px;text-align:center"><span class="spin"></span></div>';
  const fresh = await store.get("orders"); if(fresh) S.orders = fresh;
  const digits = q.replace(/[^0-9]/g,"");
  const found = S.orders.filter(o=> o.id.toUpperCase()===q || (digits.length>=8 && o.customer.phone===digits));
  if(!found.length){ box.innerHTML = `<div class="empty"><div class="big">🔍</div>Захиалга олдсонгүй.<br>Дугаараа шалгаад дахин оролдоно уу.</div>`; return; }
  box.innerHTML = found.sort((a,b)=>b.createdAt-a.createdAt).map(o=>{
    const cur = stByKey(o.status);
    const doneIdx = STATUSES.findIndex(s=>s.k===o.status);
    return `
    <div class="card" style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <b style="letter-spacing:.5px;font-size:15px">${o.id}</b><span class="badge ${cur.b}">${cur.t}</span>
      </div>
      <div style="font-size:12px;color:var(--gray);margin:4px 0 12px">${dstr(o.createdAt)} · ${o.items.length} бараа · ${fmt(o.total)}</div>
      ${o.status==="cancelled"
        ? `<div class="note">Энэ захиалга цуцлагдсан байна. Асуулт байвал бидэнтэй холбогдоорой.</div>`
        : `<div class="tl">${STATUSES.map((s,i)=>{
            const h = (o.history||[]).find(x=>x.status===s.k);
            return `<div class="tstep ${i<=doneIdx?"done":""}">
              <div class="tdot">${i<=doneIdx?"✓":i+1}</div>
              <div><b>${s.t}</b><span>${h?dstr(h.ts):""}</span></div></div>`;
          }).join("")}</div>`}
      <div style="font-size:13px;color:#444">${o.items.map(i=>`• ${esc(i.name)} — ${fmt(i.price)}`).join("<br>")}</div>
    </div>`;
  }).join("");
}

function pickImg(input){
  const files = Array.from(input.files||[]); if(!files.length) return;
  let left = files.length;
  files.forEach(f=>{
    const rd = new FileReader();
    rd.onload = ev => {
      const im = new Image();
      im.onload = () => {
        const max = 800;
        let w = im.width, h = im.height;
        if(w>h && w>max){ h*=max/w; w=max; } else if(h>=w && h>max){ w*=max/h; h=max; }
        const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(im,0,0,w,h);
        S.editImgs.push(cv.toDataURL("image/jpeg",0.72));
        if(--left===0){ render(); toast(files.length+" зураг бэлэн ✓"); }
      };
      im.src = ev.target.result;
    };
    rd.readAsDataURL(f);
  });
  input.value = "";
}

async function saveProduct(btn){
  const g = id => document.getElementById(id).value.trim();
  const name=g("fName"), price=Number(g("fPrice"));
  if(!name||!price){ toast("Нэр, үнэ хоёрыг заавал бөглөнө"); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  let p;
  if(S.editId){ p = S.products.find(x=>x.id===S.editId); }
  else { p = {id:uid(), sold:false, created:Date.now(), imgCount:0, imgs:[]}; S.products.unshift(p); }
  Object.assign(p,{name, cat:g("fCat"), price, retail:Number(g("fRetail"))||"", cond:g("fCond"), size:g("fSize"), desc:g("fDesc")});
  if(S.editImgs.length){
    // хуучин нэг-зурагтай форматыг шинэ индекс рүү шилжүүлнэ
    if(p.hasImg && !p.imgCount){
      try{ const r = await backend.get("img:"+p.id, true);
        if(r && r.value){ await backend.set("img:"+p.id+":0", r.value, true); p.imgCount = 1; }
      }catch(e){}
      p.hasImg = false;
    }
    let n = p.imgCount||0, fail = false;
    for(const d of S.editImgs){
      try{ await backend.set("img:"+p.id+":"+n, d, true); S.imgCache[p.id+":"+n]=d; n++; }
      catch(e){ fail = true; }
    }
    p.imgCount = n;
    if(fail) toast("Зарим зураг хэт том тул хадгалагдсангүй");
  }
  await saveShop();
  S.editId=null; S.editImgs=[];
  toast("Хадгалагдлаа ✓"); render();
}
async function toggleSold(id){
  const p = S.products.find(x=>x.id===id); if(!p) return;
  p.sold = !p.sold; await saveShop(); render();

async function delProduct(id){
  if(!confirm("Энэ барааг бүрмөсөн устгах уу?")) return;
  const p = S.products.find(x=>x.id===id);
  if(p){ store.del("img:"+id); for(let i=0;i<(p.imgCount||0);i++) store.del("img:"+id+":"+i); }
  S.products = S.products.filter(x=>x.id!==id);
  await saveShop(); render(); toast("Устгагдлаа");
}

  o.status = st;
  o.history = o.history||[];
  if(!o.history.find(h=>h.status===st)) o.history.push({status:st, ts:Date.now()});
  if(st==="cancelled"){
    o.items.forEach(i=>{ const p=S.products.find(x=>x.id===i.pid); if(p) p.sold=false; });
    await saveShop();
  }
  await saveOrders(); render(); toast("Төлөв шинэчлэгдлээ ✓");
}

function vAdmSettings(){
  return `<div class="card" style="max-width:480px">
    <b>Тохиргоо</b>
    <label>Админ нууц үг солих</label><input id="sPw" type="password" placeholder="Шинэ нууц үг">
    <label>Холбогдох утас (сайт дээр харагдана)</label><input id="sPh" value="${esc(S.settings.phone||"")}">
    <button class="btn btn-primary" style="margin-top:16px" onclick="saveSettings()">Хадгалах</button>
    <div class="note">⚠️ Прототип хувилбар: өгөгдөл artifact-ын дундын санд хадгалагддаг тул жинхэнэ худалдаанд гаргахын өмнө тусдаа сервер/датабазтай болгох шаардлагатай.</div>
  </div>`;
}
async function saveSettings(){
  const pw = document.getElementById("sPw").value.trim();
  const ph = document.getElementById("sPh").value.trim();
  if(pw) S.settings.adminPass = pw;
  if(ph) S.settings.phone = ph;
  await saveShop(); toast("Тохиргоо хадгалагдлаа ✓"); render();
}

/* toast */
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"),2600);
}
</script>
